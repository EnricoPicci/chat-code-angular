<div class="wiki-card">
  <div class="wiki-card__image" *ngIf="article.thumbnail">
    <img [src]="article.thumbnail.url" [alt]="article.title + ' thumbnail'" />
  </div>
  <div class="wiki-card__content">
    <h2 class="wiki-card__title">{{ article.title }}</h2>
    <p class="wiki-card__description" *ngIf="article.description">{{ article.description }}</p>
    <p class="wiki-card__excerpt">{{ article.excerpt }}</p>
    <a class="wiki-card__link" [href]="'https://en.wikipedia.org/wiki/' + article.key" target="_blank" rel="noopener noreferrer">
      Read more on Wikipedia
    </a>
  </div>
</div>
