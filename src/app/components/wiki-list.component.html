<div class="wiki-list">
  <form (ngSubmit)="fetchArticles()" class="wiki-list__form" autocomplete="off">
    <input type="text" [formControl]="searchControl" placeholder="Search Wikipedia articles..." class="wiki-list__input" />
    <button type="button" (click)="fetchArticles()" class="wiki-list__button" [disabled]="loading()">Search</button>
  </form>

  <div *ngIf="error()" class="wiki-list__error">{{ error() }}</div>
  <div *ngIf="loading()" class="wiki-list__loading">Loading...</div>

  <div class="wiki-list__grid">
    <app-wiki-card *ngFor="let article of articles()" [article]="article"></app-wiki-card>
  </div>
</div>
