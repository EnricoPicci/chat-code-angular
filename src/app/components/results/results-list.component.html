<mat-list *ngIf="results.length; else noResults">
  <mat-list-item *ngFor="let item of results">
    <mat-card class="result-card">
      <mat-card-title>{{ item.title }}</mat-card-title>
      <mat-card-content [innerHTML]="item.snippet"></mat-card-content>
      <mat-card-actions>
        <a mat-button color="accent" [href]="'https://en.wikipedia.org/?curid=' + item.pageid" target="_blank" rel="noopener">
          Read more
        </a>
      </mat-card-actions>
    </mat-card>
  </mat-list-item>
</mat-list>
<ng-template #noResults>
  <p>No results found.</p>
</ng-template>
